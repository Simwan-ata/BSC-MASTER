name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: BSC-MASTER-standalone-html
          path: dist/BSC-MASTER-standalone.html
          if-no-files-found: error
          retention-days: 30
